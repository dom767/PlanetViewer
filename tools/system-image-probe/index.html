<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>System image probe</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --green: #3fb950;
      --red: #f85149;
      --accent: #58a6ff;
      --gold: #d4a72c;
      --hover: #21262d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.4;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 12px;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    button.stop { background: var(--red); }
    button.icon {
      background: transparent;
      color: var(--muted);
      padding: 2px 4px;
      font-size: 14px;
      line-height: 1;
    }
    button.icon:hover:not(:disabled) { color: var(--accent); }
    .source-star {
      color: var(--gold);
      font-size: 14px;
      line-height: 1;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      color: var(--muted);
      font-size: 13px;
    }
    .stats strong { color: var(--text); }
    .progress { color: var(--accent); }
    main { padding: 0 12px 24px; }
    .table-wrap {
      overflow: auto;
      max-height: calc(100vh - 160px);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1020px;
    }
    thead th {
      position: sticky;
      top: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 8px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
    }
    tbody tr:hover { background: var(--hover); }
    td {
      border-bottom: 1px solid var(--border);
      padding: 8px;
      vertical-align: middle;
    }
    .host { font-weight: 500; }
    .source-cell {
      text-align: center;
      white-space: normal;
      min-width: 88px;
    }
    .source-cell.selected {
      background: rgba(212, 167, 44, 0.12);
      outline: 1px solid rgba(212, 167, 44, 0.35);
      outline-offset: -1px;
    }
    .source-cell-inner {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .preview-cell {
      min-width: 72px;
    }
    .preview-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: flex-start;
    }
    .preview-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
      border-radius: 6px;
    }
    .preview-item:disabled {
      cursor: default;
      opacity: 0.7;
    }
    .preview-item .preview {
      display: block;
    }
    .preview-item.selected .preview {
      outline: 2px solid var(--gold);
      outline-offset: 1px;
      box-shadow: 0 0 0 1px rgba(212, 167, 44, 0.35);
    }
    .preview-item:not(.selected):hover .preview {
      border-color: var(--accent);
    }
    .preview-label {
      font-size: 10px;
      color: var(--muted);
      max-width: 64px;
      line-height: 1.2;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .preview-item.selected .preview-label {
      color: var(--gold);
      font-weight: 600;
    }
    .selected-source { font-size: 12px; color: var(--muted); }
    .selected-source strong { color: var(--gold); font-weight: 600; }
    .attr-ok { color: var(--green); font-size: 16px; line-height: 1; }
    .attr-no { color: var(--muted); font-size: 16px; }
    .preview {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .preview-link {
      display: inline-block;
      line-height: 0;
    }
    .placeholder {
      width: 64px;
      height: 64px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 11px;
    }
    .rerun { width: 36px; text-align: center; }
    .hint { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .lightbox.open { display: flex; }
    .lightbox-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(1, 4, 9, 0.82);
    }
    .lightbox-frame {
      position: relative;
      margin: 0;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
      max-width: calc(100vw - 48px);
    }
    .lightbox-frame img {
      display: block;
      width: 300px;
      height: 300px;
      object-fit: cover;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .lightbox-caption {
      margin: 10px 0 0;
      max-width: 300px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }
    .lightbox-close {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 6px;
      background: var(--hover);
      color: var(--text);
      font-size: 18px;
      line-height: 1;
    }
    .lightbox-close:hover { background: var(--border); }
    .status-overlay {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .status-overlay.open { display: flex; }
    .status-overlay-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(1, 4, 9, 0.72);
    }
    .status-panel {
      position: relative;
      width: min(640px, calc(100vw - 48px));
      max-height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
      padding: 16px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
    }
    .status-panel h2 {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 600;
    }
    .status-summary {
      color: var(--accent);
      font-size: 13px;
      margin-bottom: 12px;
    }
    .status-sources {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .status-source {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 12px;
      color: var(--muted);
    }
    .status-source.pending { opacity: 0.55; }
    .status-source.queried {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 0 1px rgba(88, 166, 255, 0.25);
    }
    .status-source.successful {
      border-color: rgba(63, 185, 80, 0.45);
      color: var(--green);
    }
    .status-source.not_found { color: var(--muted); }
    .status-source-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.8;
    }
    .status-source.queried .status-source-dot {
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1); }
    }
    .status-log-wrap {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      max-height: min(280px, 40vh);
      overflow: auto;
      flex: 1 1 auto;
      min-height: 120px;
    }
    .status-log {
      margin: 0;
      padding: 8px 10px;
      list-style: none;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 11px;
      line-height: 1.5;
    }
    .status-log li {
      padding: 2px 0;
      color: var(--muted);
      border-bottom: 1px solid rgba(48, 54, 61, 0.55);
    }
    .status-log li:last-child { border-bottom: none; }
    .status-log .ok { color: var(--green); }
    .status-log .fail { color: var(--muted); }
    .status-log .info { color: var(--accent); }
    .status-footer {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }
    .status-close {
      min-width: 96px;
    }
    .source-status {
      display: block;
      font-size: 11px;
      line-height: 1.3;
      margin-bottom: 4px;
      color: var(--muted);
    }
    .source-status.successful { color: var(--green); }
    .source-status.queried { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>System image probe dashboard</h1>
    <p style="margin:0;color:var(--muted);font-size:13px;">
      Five sources per directly imaged host — ESO, Commons, NASA, Wikipedia list, OEC.
    </p>
    <p class="hint">Click a preview to choose the app image. Double-click a preview to view it at 300×300.</p>
    <div class="controls">
      <button id="checkAll" type="button">Check all</button>
      <button id="checkMissing" type="button">Check missing</button>
      <button id="stopProbe" type="button" class="stop" hidden>Stop</button>
      <span id="progress" class="progress"></span>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <main>
    <div class="table-wrap">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
  <div id="statusOverlay" class="status-overlay" aria-hidden="true">
    <div class="status-overlay-backdrop"></div>
    <section class="status-panel" aria-labelledby="statusTitle">
      <h2 id="statusTitle">Live probe status</h2>
      <div class="status-summary" id="statusSummary"></div>
      <div class="status-sources" id="statusSources"></div>
      <div class="status-log-wrap">
        <ul class="status-log" id="statusLog"></ul>
      </div>
      <div class="status-footer">
        <button id="statusClose" type="button" class="status-close" disabled>Close</button>
      </div>
    </section>
  </div>
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <div class="lightbox-backdrop" data-close></div>
    <figure class="lightbox-frame">
      <button type="button" class="lightbox-close" data-close aria-label="Close">×</button>
      <img id="lightboxImg" alt="" width="300" height="300" />
      <figcaption id="lightboxCaption" class="lightbox-caption"></figcaption>
    </figure>
  </div>
  <script>
    const SOURCE_LABELS = {
      esoTitle: "ESO title",
      commons: "Commons",
      nasa: "NASA",
      wikiList: "Wikipedia",
      oec: "OEC",
    };

    const SOURCE_STATUS = {
      pending: { label: "…", title: "Not queried yet" },
      queried: { label: "Queried", title: "Query in progress" },
      not_found: { label: "Nothing found", title: "Queried but nothing found" },
      successful: { label: "Successful", title: "Match found" },
    };

    let state = { hosts: [], results: { hosts: {} }, sourceKeys: [], probing: false, probeServerVersion: null };
    let pollTimer = null;
    let statusOverlayOpen = false;

    function openStatusOverlay() {
      statusOverlayOpen = true;
      const overlay = document.getElementById("statusOverlay");
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
    }

    function closeStatusOverlay() {
      statusOverlayOpen = false;
      const overlay = document.getElementById("statusOverlay");
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
    }

    document.getElementById("statusClose").addEventListener("click", () => {
      if (!state.probing) closeStatusOverlay();
    });

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxCaption = document.getElementById("lightboxCaption");

    function openLightbox(src, caption) {
      lightboxImg.src = src;
      lightboxCaption.textContent = caption || "";
      lightbox.classList.add("open");
      lightbox.setAttribute("aria-hidden", "false");
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden", "true");
      lightboxImg.removeAttribute("src");
      lightboxCaption.textContent = "";
    }

    document.addEventListener("click", (e) => {
      if (e.target.closest("[data-close]")) {
        closeLightbox();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && lightbox.classList.contains("open")) closeLightbox();
    });

    function esc(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;");
    }

    function resolveCellStatus(cell, isActive) {
      if (isActive) return "queried";
      if (cell?.status) return cell.status;
      if (!cell) return "pending";
      return cell.ok ? "successful" : "not_found";
    }

    function statusMeta(status) {
      return SOURCE_STATUS[status] || SOURCE_STATUS.pending;
    }

    function tooltipCell(cell) {
      if (!cell) return "";
      const parts = [];
      if (cell.title) parts.push(cell.title);
      if (cell.score != null) parts.push(`score ${cell.score}`);
      if (cell.error) parts.push(cell.error);
      if (cell.assetError) parts.push(cell.assetError);
      if (cell.credit) parts.push(cell.credit);
      if (cell.license) parts.push(cell.license);
      const status = resolveCellStatus(cell, false);
      parts.unshift(statusMeta(status).title);
      return parts.join(" · ");
    }

    function sourceCellHtml(name, sourceKey, cell, selectedSource, probing) {
      const isActive = probing && state.progress?.sourceKey === sourceKey &&
        (state.progress?.phase === "source" || state.progress?.phase === "assets");
      const live = state.probing ? state.progress?.liveSources?.[sourceKey] : null;
      const status = resolveCellStatus(live || cell, isActive);
      const meta = statusMeta(status);
      const statusHtml = `<span class="source-status ${status}">${esc(meta.label)}</span>`;
      const selected = selectedSource === sourceKey;
      const star = selected && cell?.ok
        ? `<span class="source-star" title="Selected for app">★</span>`
        : "";
      return `
        <td class="source-cell${selected ? " selected" : ""}" title="${esc(tooltipCell(cell || live))}">
          <span class="source-cell-inner">${statusHtml}${star}</span>
        </td>`;
    }

    function previewColumnHtml(name, sources, keys, selectedSource, probing) {
      const hits = keys
        .map((key) => ({ key, cell: sources[key] }))
        .filter(({ cell }) => cell?.ok && cell?.thumb);

      if (!hits.length) {
        return `<td class="preview-cell"><div class="placeholder">—</div></td>`;
      }

      const items = hits.map(({ key, cell }) => {
        const selected = key === selectedSource;
        const label = SOURCE_LABELS[key] || key;
        const caption = `${name} · ${label} · ${tooltipCell(cell)}`;
        const previewPath = cell.preview ? `/${cell.preview}` : "";
        return `
          <button type="button" class="preview-item${selected ? " selected" : ""}"
            data-name="${encodeURIComponent(name)}"
            data-source="${key}"
            data-preview="${esc(previewPath)}"
            data-caption="${esc(caption)}"
            title="${esc(selected ? `${label} · selected for app` : `Select ${label} for the app`)}"
            ${probing ? "disabled" : ""}>
            <img class="preview" src="/${cell.thumb}" alt="${esc(label)}" width="64" height="64" />
            <span class="preview-label">${esc(label)}</span>
          </button>
        `;
      }).join("");

      return `<td class="preview-cell"><div class="preview-row">${items}</div></td>`;
    }

    async function selectPreviewSource(hostName, source) {
      const res = await fetch(`/api/select/${encodeURIComponent(hostName)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ source }),
      });
      if (!res.ok) {
        const err = await res.json();
        alert(err.error || "Selection failed");
        return false;
      }
      await refresh();
      return true;
    }

    function sortHosts(hosts) {
      return [...hosts].sort((a, b) => a.localeCompare(b));
    }

    function phaseLabel(progress) {
      if (progress.phase === "wiki-table") return "Loading Wikipedia table";
      if (progress.phase === "source" && progress.sourceKey) {
        return `Querying ${SOURCE_LABELS[progress.sourceKey] || progress.sourceKey} (${progress.sourceIndex}/${progress.sourceTotal})`;
      }
      if (progress.phase === "assets" && progress.sourceKey) {
        return `Downloading ${SOURCE_LABELS[progress.sourceKey] || progress.sourceKey} preview`;
      }
      if (progress.phase === "host-done") return "Finishing host";
      if (progress.phase === "cancelled") return "Stopped";
      return "Working…";
    }

    function logLineClass(message) {
      if (/successful/i.test(message)) return "ok";
      if (/nothing found|error|failed|stopped/i.test(message)) return "fail";
      return "info";
    }

    function renderStatusPanel(probing, progress, sourceKeys) {
      if (probing && !statusOverlayOpen) openStatusOverlay();
      const overlay = document.getElementById("statusOverlay");
      if (!statusOverlayOpen) {
        overlay.classList.remove("open");
        overlay.setAttribute("aria-hidden", "true");
        return;
      }

      const closeBtn = document.getElementById("statusClose");
      closeBtn.disabled = probing;

      const keys = sourceKeys.length ? sourceKeys : Object.keys(SOURCE_LABELS);
      const hostPart = progress.hostTotal > 1
        ? `Host ${progress.hostIndex}/${progress.hostTotal}: `
        : progress.name
          ? `${progress.name}: `
          : "";
      document.getElementById("statusSummary").textContent =
        probing
          ? `${progress.mode === "missing" ? "Check missing · " : ""}${hostPart}${phaseLabel(progress)}`
          : progress.cancelled
            ? `Stopped after ${progress.hostIndex}/${progress.hostTotal} hosts`
            : "Probe finished";

      document.getElementById("statusSources").innerHTML = keys.map((key) => {
        const live = progress.liveSources?.[key];
        const isActive = probing && progress.sourceKey === key &&
          (progress.phase === "source" || progress.phase === "assets");
        const status = resolveCellStatus(live, isActive);
        const meta = statusMeta(status);
        return `
          <span class="status-source ${status}" title="${esc(live ? tooltipCell(live) : meta.title)}">
            <span class="status-source-dot"></span>
            ${esc(SOURCE_LABELS[key] || key)}: ${esc(meta.label)}
          </span>
        `;
      }).join("");

      const logEl = document.getElementById("statusLog");
      const lines = progress.log || [];
      logEl.innerHTML = lines.map((entry) =>
        `<li class="${logLineClass(entry.message)}">${esc(entry.message)}</li>`
      ).join("");
    }

    function computeStats(hosts, resultsHosts) {
      let selected = 0;
      let noSelection = 0;
      let attrMissing = 0;
      for (const name of hosts) {
        const row = resultsHosts[name];
        if (!row?.selectedSource) {
          noSelection++;
          continue;
        }
        selected++;
        if (!row.attributionOk) attrMissing++;
      }
      return { selected, noSelection, attrMissing, total: hosts.length };
    }

    function render() {
      const { hosts, results, sourceKeys, probing, progress } = state;
      const resultsHosts = results.hosts || {};
      const keys = sourceKeys.length ? sourceKeys : Object.keys(SOURCE_LABELS);

      const stats = computeStats(hosts, resultsHosts);
      const serverVersion = state.probeServerVersion || results.probeServerVersion;
      document.getElementById("stats").innerHTML = `
        <span><strong>${stats.selected}</strong> selected for app</span>
        <span><strong>${stats.noSelection}</strong> no selection</span>
        <span><strong>${stats.attrMissing}</strong> attribution missing</span>
        <span>of <strong>${stats.total}</strong> hosts</span>
        ${serverVersion ? `<span>Probe server <strong>v${esc(serverVersion)}</strong></span>` : ""}
        ${results.updatedAt ? `<span>Last run: ${new Date(results.updatedAt).toLocaleString()}</span>` : ""}
      `;

      document.getElementById("checkAll").disabled = probing;
      const checkMissingBtn = document.getElementById("checkMissing");
      checkMissingBtn.disabled = probing || stats.noSelection === 0;
      checkMissingBtn.title = stats.noSelection === 0
        ? "All hosts already have a selected image"
        : `Probe ${stats.noSelection} host(s) with no selection`;
      const stopBtn = document.getElementById("stopProbe");
      stopBtn.hidden = !probing;
      const prog = document.getElementById("progress");
      if (probing && progress?.running !== false) {
        const suffix = progress.cancelled ? " — stopping…" : "";
        const hostPart = progress.hostTotal > 0
          ? `${progress.hostIndex} / ${progress.hostTotal}`
          : "…";
        prog.textContent = `${hostPart} — ${progress.name || "…"}${suffix}`;
      } else if (probing) {
        prog.textContent = "Starting…";
      } else if (progress?.cancelled) {
        prog.textContent = `Stopped at ${progress.hostIndex} / ${progress.hostTotal}`;
      } else {
        prog.textContent = "";
      }

      renderStatusPanel(probing, progress, keys);

      document.getElementById("thead").innerHTML = `
        <tr>
          <th></th>
          <th>Host</th>
          ${keys.map((k) => `<th>${SOURCE_LABELS[k] || k}</th>`).join("")}
          <th>Attribution</th>
          <th>Selected</th>
          <th>Preview</th>
        </tr>
      `;

      const sorted = sortHosts(hosts);
      document.getElementById("tbody").innerHTML = sorted.map((name) => {
        const row = resultsHosts[name] || {};
        const sources = row.sources || {};
        const selectedSource = row.selectedSource;
        const selectedCell = selectedSource ? sources[selectedSource] : null;
        const attrTip = selectedCell
          ? `${selectedCell.credit || ""} · ${selectedCell.license || ""}`
          : "No selection";
        const selectedLabel = selectedSource
          ? `<span class="selected-source"><strong>${SOURCE_LABELS[selectedSource] || selectedSource}</strong></span>`
          : `<span class="selected-source">—</span>`;
        return `
          <tr data-name="${encodeURIComponent(name)}">
            <td class="rerun">
              <button type="button" class="icon rerun-btn" title="Rerun probe" ${probing ? "disabled" : ""}>↻</button>
            </td>
            <td class="host" title="${esc([name, row.checkedAt ? `Checked ${new Date(row.checkedAt).toLocaleString()}` : "", row.probeServerVersion ? `Probe server v${row.probeServerVersion}` : ""].filter(Boolean).join(" · "))}">${esc(name)}</td>
            ${keys.map((k) => sourceCellHtml(name, k, sources[k], selectedSource, probing)).join("")}
            <td title="${esc(attrTip)}">${row.attributionOk ? '<span class="attr-ok">✓</span>' : '<span class="attr-no">✗</span>'}</td>
            <td>${selectedLabel}</td>
            ${previewColumnHtml(name, sources, keys, selectedSource, probing)}
          </tr>
        `;
      }).join("");

      document.querySelectorAll(".rerun-btn").forEach((el) => {
        el.addEventListener("click", async (e) => {
          const tr = e.target.closest("tr");
          const hostName = decodeURIComponent(tr.dataset.name);
          e.target.disabled = true;
          try {
            openStatusOverlay();
            state.probing = true;
            render();
            startPolling();
            await fetch(`/api/probe/${encodeURIComponent(hostName)}`, { method: "POST" });
            await refresh();
          } catch (err) {
            console.error(err);
          }
          e.target.disabled = false;
        });
      });

      document.querySelectorAll(".preview-item").forEach((el) => {
        el.addEventListener("click", async (e) => {
          if (el.disabled || el.classList.contains("selected")) return;
          el.disabled = true;
          try {
            const hostName = decodeURIComponent(el.dataset.name);
            await selectPreviewSource(hostName, el.dataset.source);
          } catch (err) {
            console.error(err);
          }
          el.disabled = false;
        });
        el.addEventListener("dblclick", (e) => {
          e.preventDefault();
          const preview = el.dataset.preview;
          if (!preview) return;
          openLightbox(preview, el.dataset.caption || "");
        });
      });
    }

    async function refresh() {
      const res = await fetch("/api/state");
      state = await res.json();
      if (state.probing && !statusOverlayOpen) openStatusOverlay();
      render();
    }

    function startPolling() {
      if (pollTimer) return;
      pollTimer = setInterval(async () => {
        await refresh();
        if (!state.probing) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }, 600);
    }

    async function startBatchProbe(url) {
      const res = await fetch(url, { method: "POST" });
      const body = await res.json();
      if (!res.ok) {
        alert(body.error || "Probe failed to start");
        return;
      }
      if (body.started === false) {
        alert(body.message || "Nothing to probe");
        return;
      }
      state.probing = true;
      openStatusOverlay();
      render();
      startPolling();
      await refresh();
    }

    document.getElementById("checkAll").addEventListener("click", () => {
      startBatchProbe("/api/probe/all");
    });

    document.getElementById("checkMissing").addEventListener("click", () => {
      startBatchProbe("/api/probe/missing");
    });

    document.getElementById("stopProbe").addEventListener("click", async () => {
      const stopBtn = document.getElementById("stopProbe");
      stopBtn.disabled = true;
      try {
        await fetch("/api/probe/stop", { method: "POST" });
        await refresh();
      } catch (err) {
        console.error(err);
      }
      stopBtn.disabled = false;
    });

    refresh();
  </script>
</body>
</html>
